name: Spring Boot CI/CD -> Deploy to Docker Hub -> Deploy to AWS EC2

on:
  push:
    branches: ["main"]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/spring-ci-demo:${{ github.sha }} -t ${{ secrets.DOCKER_USERNAME }}/spring-ci-demo:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-ci-demo:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/spring-ci-demo:latest

      - name: SSH and Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_SERVER_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. Stop and remove existing container if running
            docker stop spring-app || true
            docker rm spring-app || true

            # 2. Pull the newly pushed image
            docker pull ${{ secrets.DOCKER_USERNAME }}/spring-ci-demo:${{ github.sha }}

            # 3. Run the container mapping host 9098 to container 9098
            docker run -d -p 9098:9098 --name spring-app ${{ secrets.DOCKER_USERNAME }}/spring-ci-demo:${{ github.sha }}

            # 4. Clean up unused images on EC2
            docker image prune -f